name: Release beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Scan release source
        run: bun run security:scan

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read release version
        id: release
        run: |
          version="$(bun -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must run from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi

          if git rev-parse --quiet --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

          bun run release:validate

      - name: Run quality gate
        run: bun run check

  build-debian:
    name: Package Debian application
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package Debian application
        run: bun run package:linux

      - name: Verify packaged application files
        run: |
          ./node_modules/.bin/asar list release/linux-unpacked/resources/app.asar > /tmp/package-contents
          grep --fixed-strings --line-regexp '/assets/railyard-appicon.png' /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/main/index.js' /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/preload/index.cjs' /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/renderer/index.html' /tmp/package-contents
          grep --fixed-strings --line-regexp '/LICENSE' /tmp/package-contents
          grep --fixed-strings --line-regexp '/NOTICE' /tmp/package-contents
          grep --fixed-strings --line-regexp '/THIRD_PARTY_NOTICES.md' /tmp/package-contents
          grep --fixed-strings --line-regexp '/node_modules/@earendil-works/pi-coding-agent/package.json' /tmp/package-contents
          grep --fixed-strings --line-regexp '/node_modules/electron-updater/package.json' /tmp/package-contents
          grep --fixed-strings --line-regexp '/node_modules/@mariozechner/clipboard-linux-x64-gnu/package.json' /tmp/package-contents
          grep --fixed-strings --line-regexp 'owner: pi-workspace' release/linux-unpacked/resources/app-update.yml
          grep --fixed-strings --line-regexp 'repo: railyard' release/linux-unpacked/resources/app-update.yml

      - name: Identify package and create checksum
        id: package
        working-directory: release
        run: |
          packages=(railyard-*.deb)

          if [[ "${#packages[@]}" != 1 ]]; then
            echo "Expected exactly one Debian package." >&2
            exit 1
          fi

          package="${packages[0]}"
          sha256sum "$package" > "${package%.deb}.sha256"
          echo "path=release/$package" >> "$GITHUB_OUTPUT"
          echo "sbom=release/${package%.deb}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Unpack packaged application for SBOM
        run: |
          ./node_modules/.bin/asar extract \
            release/linux-unpacked/resources/app.asar \
            release/linux-unpacked/resources/app-asar

      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/linux-unpacked/resources
          config: .syft.yaml
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false

      - name: Verify package SBOM
        env:
          SBOM: ${{ steps.package.outputs.sbom }}
        run: |
          for package in \
            railyard \
            @earendil-works/pi-coding-agent \
            @earendil-works/pi-tui \
            electron-updater \
            react \
            @mariozechner/clipboard-linux-x64-gnu; do
            jq --exit-status --arg package "$package" \
              'any(.packages[]?; .name == $package)' "$SBOM" >/dev/null
          done

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-amd64
          path: |
            release/*.deb
            release/*.sha256
            release/*.spdx.json
          if-no-files-found: error

  verify-debian:
    name: Verify on Debian ${{ matrix.debian }}
    needs: [validate, build-debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']

    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-amd64
          path: release

      - name: Install and launch release candidate
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
        run: |
          image="debian:$DEBIAN_VERSION"

          for attempt in 1 2 3; do
            if docker pull "$image"; then
              break
            fi

            if [[ "$attempt" = 3 ]]; then
              echo "Unable to pull $image after $attempt attempts." >&2
              exit 1
            fi

            sleep "$((attempt * 5))"
          done

          docker run --rm \
            --volume "$PWD/release:/release:ro" \
            "$image" \
            bash -euxo pipefail -c '
              apt-get update
              cd /release
              sha256sum --check railyard-*.sha256
              apt-get install --yes gir1.2-gtk-3.0 python3-gi xvfb ./railyard-*.deb
              dpkg-query --show railyard

              installed_version="$(dpkg-query --show railyard | cut --fields=2)"
              package_version="$(dpkg-deb --field ./railyard-*.deb Version)"
              test "$installed_version" = "$package_version"

              desktop_entry=/usr/share/applications/railyard.desktop
              grep --fixed-strings --line-regexp "Name=Railyard" "$desktop_entry"
              grep --fixed-strings --line-regexp "Icon=railyard" "$desktop_entry"
              grep --fixed-strings --line-regexp "Categories=Development;" "$desktop_entry"

              for icon_size in 16 24 32 48 64 96 128 256 512; do
                test -f "/usr/share/icons/hicolor/${icon_size}x${icon_size}/apps/railyard.png"
              done

              resolved_icon="$(
                python3 - <<PY
          import gi

          gi.require_version("Gtk", "3.0")
          from gi.repository import Gtk

          theme = Gtk.IconTheme.new()
          theme.set_custom_theme("hicolor")
          icon = theme.lookup_icon("railyard", 48, 0)

          print(icon.get_filename() if icon else "")
          PY
              )"
              test "$resolved_icon" = /usr/share/icons/hicolor/48x48/apps/railyard.png

              set +e
              timeout 10s xvfb-run --auto-servernum railyard --no-sandbox >/tmp/railyard.log 2>&1
              launch_status=$?
              set -e

              if [[ "$launch_status" != 124 ]]; then
                cat /tmp/railyard.log
                exit 1
              fi

              apt-get remove --yes railyard
              test ! -e /usr/bin/railyard
              test ! -e "$desktop_entry"
            '

  build-windows:
    name: Package Windows application
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package Windows application
        run: bun run package:win

      - name: Verify packaged application files
        shell: pwsh
        run: |
          $packageContents = @(& bun x asar list release/win-unpacked/resources/app.asar) -replace '\\', '/'
          $expectedPaths = @(
            '/assets/railyard-appicon.png'
            '/dist/main/index.js'
            '/dist/preload/index.cjs'
            '/dist/renderer/index.html'
            '/LICENSE'
            '/NOTICE'
            '/THIRD_PARTY_NOTICES.md'
            '/node_modules/@earendil-works/pi-coding-agent/package.json'
            '/node_modules/electron-updater/package.json'
            '/node_modules/@mariozechner/clipboard-win32-x64-msvc/package.json'
          )

          foreach ($expectedPath in $expectedPaths) {
            if ($packageContents -notcontains $expectedPath) {
              throw "Packaged application is missing $expectedPath."
            }
          }

          $updateConfiguration = Get-Content release/win-unpacked/resources/app-update.yml
          if ($updateConfiguration -notcontains 'owner: pi-workspace' -or $updateConfiguration -notcontains 'repo: railyard') {
            throw 'Packaged application has an invalid update source.'
          }

      - name: Identify package and create checksum
        id: package
        shell: pwsh
        working-directory: release
        run: |
          $packages = @(Get-ChildItem -File -Filter 'railyard-*-win-x64-setup.exe')

          if ($packages.Count -ne 1) {
            throw 'Expected exactly one Windows installer.'
          }

          $package = $packages[0]
          $hash = (Get-FileHash -Algorithm SHA256 $package.FullName).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -NoNewline "$($package.BaseName).sha256"
          "path=release/$($package.Name)" >> $env:GITHUB_OUTPUT
          "sbom=release/$($package.BaseName).spdx.json" >> $env:GITHUB_OUTPUT

      - name: Unpack packaged application for SBOM
        shell: pwsh
        run: |
          & bun x asar extract `
            release/win-unpacked/resources/app.asar `
            release/win-unpacked/resources/app-asar

      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/win-unpacked/resources
          config: .syft.yaml
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false

      - name: Verify package SBOM
        shell: pwsh
        env:
          SBOM: ${{ steps.package.outputs.sbom }}
        run: |
          $packageNames = @((Get-Content $env:SBOM -Raw | ConvertFrom-Json).packages | ForEach-Object name)

          foreach ($package in @(
            'railyard'
            '@earendil-works/pi-coding-agent'
            '@earendil-works/pi-tui'
            'electron-updater'
            'react'
            '@mariozechner/clipboard-win32-x64-msvc'
          )) {
            if ($packageNames -notcontains $package) {
              throw "Package SBOM is missing $package."
            }
          }

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-win-x64
          path: |
            release/*.exe
            release/*.sha256
            release/*.spdx.json
          if-no-files-found: error

  verify-windows:
    name: Verify Windows x64 installer
    needs: [validate, build-windows]
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-win-x64
          path: release

      - name: Verify, install, launch, and uninstall release candidate
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release -File -Filter 'railyard-*-win-x64-setup.exe')
          $checksum = @(Get-ChildItem release -File -Filter 'railyard-*-win-x64-setup.sha256')

          if ($installer.Count -ne 1 -or $checksum.Count -ne 1) {
            throw 'Expected one Windows installer and checksum.'
          }

          $expectedHash = (Get-Content $checksum[0].FullName -Raw).Split()[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer[0].FullName).Hash.ToLowerInvariant()

          if ($actualHash -ne $expectedHash) {
            throw 'Windows installer checksum does not match.'
          }

          $installerProcess = Start-Process `
            -FilePath $installer[0].FullName `
            -ArgumentList '/S' `
            -Wait `
            -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "Windows installer exited with $($installerProcess.ExitCode)."
          }

          $application = Get-ChildItem "$env:LOCALAPPDATA\Programs" -File -Filter 'Railyard.exe' -Recurse |
            Select-Object -First 1
          if (-not $application) {
            throw 'Windows installer did not install Railyard.'
          }

          $applicationProcess = Start-Process -FilePath $application.FullName -ArgumentList '--no-sandbox' -PassThru
          Start-Sleep -Seconds 10

          if ($applicationProcess.HasExited) {
            throw 'Installed Railyard exited during launch verification.'
          }

          Stop-Process -Id $applicationProcess.Id -Force

          $uninstaller = Get-ChildItem $application.DirectoryName -File -Filter 'Uninstall *.exe' | Select-Object -First 1
          if (-not $uninstaller) {
            throw 'Windows installer did not install an uninstaller.'
          }

          $uninstallerProcess = Start-Process `
            -FilePath $uninstaller.FullName `
            -ArgumentList '/S' `
            -Wait `
            -PassThru
          if ($uninstallerProcess.ExitCode -ne 0 -or (Test-Path $application.FullName)) {
            throw 'Windows uninstaller did not remove Railyard.'
          }

  build-macos:
    name: Package macOS application
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign, notarize, and package macOS application
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          required_secrets=(APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER CSC_KEY_PASSWORD CSC_LINK)
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required repository secret $secret_name is not configured." >&2
              exit 1
            fi
          done

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          export APPLE_API_KEY="$api_key_path"

          bun run package:mac

      - name: Verify packaged application files
        run: |
          asar_paths=()
          while IFS= read -r -d '' asar_path; do
            asar_paths+=("$asar_path")
          done < <(find release -path '*.app/Contents/Resources/app.asar' -type f -print0)

          if [[ "${#asar_paths[@]}" != 1 ]]; then
            echo "Expected exactly one packaged macOS application." >&2
            exit 1
          fi

          ./node_modules/.bin/asar list "${asar_paths[0]}" > /tmp/package-contents
          grep --fixed-strings --line-regexp '/assets/railyard-appicon.png' /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/main/index.js' /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/preload/index.cjs' /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/renderer/index.html' /tmp/package-contents
          grep --fixed-strings --line-regexp '/LICENSE' /tmp/package-contents
          grep --fixed-strings --line-regexp '/NOTICE' /tmp/package-contents
          grep --fixed-strings --line-regexp '/THIRD_PARTY_NOTICES.md' /tmp/package-contents
          grep --fixed-strings --line-regexp '/node_modules/@earendil-works/pi-coding-agent/package.json' /tmp/package-contents
          grep --fixed-strings --line-regexp '/node_modules/electron-updater/package.json' /tmp/package-contents
          grep --fixed-strings --line-regexp '/node_modules/@mariozechner/clipboard/package.json' /tmp/package-contents

          resources_path="$(dirname "${asar_paths[0]}")"
          grep --fixed-strings --line-regexp 'owner: pi-workspace' "$resources_path/app-update.yml"
          grep --fixed-strings --line-regexp 'repo: railyard' "$resources_path/app-update.yml"

      - name: Identify updater artifacts and create checksums
        id: package
        working-directory: release
        run: |
          packages=(railyard-*-mac-universal.dmg)
          archives=(railyard-*-mac-universal.zip)
          metadata=beta-mac.yml

          if [[ "${#packages[@]}" != 1 || "${#archives[@]}" != 1 || ! -f "$metadata" ]]; then
            echo "Expected one macOS disk image, update archive, and metadata file." >&2
            exit 1
          fi

          package="${packages[0]}"
          archive="${archives[0]}"
          shasum -a 256 "$package" > "${package%.dmg}.sha256"
          shasum -a 256 "$archive" > "$archive.sha256"
          archive_sha512="$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          grep --fixed-strings --line-regexp "version: ${{ needs.validate.outputs.version }}" "$metadata"
          grep --fixed-strings "url: $archive" "$metadata"
          grep --fixed-strings --line-regexp "    sha512: $archive_sha512" "$metadata"
          echo "path=release/$package" >> "$GITHUB_OUTPUT"
          echo "sbom=release/${package%.dmg}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Unpack packaged application for SBOM
        id: sbom-source
        run: |
          application_path="$(find release -path '*.app' -type d -print -quit)"
          resources_path="$application_path/Contents/Resources"
          ./node_modules/.bin/asar extract \
            "$resources_path/app.asar" \
            "$resources_path/app-asar"
          echo "path=$resources_path" >> "$GITHUB_OUTPUT"

      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ steps.sbom-source.outputs.path }}
          config: .syft.yaml
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false

      - name: Verify package SBOM
        env:
          SBOM: ${{ steps.package.outputs.sbom }}
        run: |
          for package in \
            railyard \
            @earendil-works/pi-coding-agent \
            @earendil-works/pi-tui \
            electron-updater \
            react \
            @mariozechner/clipboard-darwin-arm64; do
            jq --exit-status --arg package "$package" \
              'any(.packages[]?; .name == $package)' "$SBOM" >/dev/null
          done

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-mac-universal
          path: |
            release/*.dmg
            release/*.zip
            release/*-mac.yml
            release/*.sha256
            release/*.spdx.json
          if-no-files-found: error

  verify-macos:
    name: Verify on macOS 15
    needs: [validate, build-macos]
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-mac-universal
          path: release

      - name: Verify, mount, and launch release candidate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          cd release
          shasum -a 256 --check railyard-*-mac-universal.sha256
          shasum -a 256 --check railyard-*-mac-universal.zip.sha256

          disk_image="$(echo railyard-*-mac-universal.dmg)"
          archive="$(echo railyard-*-mac-universal.zip)"
          metadata="beta-mac.yml"
          archive_sha512="$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          grep --fixed-strings --line-regexp "version: $VERSION" "$metadata"
          grep --fixed-strings "url: $archive" "$metadata"
          grep --fixed-strings --line-regexp "    sha512: $archive_sha512" "$metadata"

          update_path="$(mktemp -d)"
          ditto -x -k "$archive" "$update_path"
          update_application="$update_path/Railyard.app"
          test -d "$update_application"
          codesign --verify --deep --strict --verbose=2 "$update_application"
          spctl --assess --type execute --verbose=4 "$update_application"
          xcrun stapler validate "$update_application"

          mount_path="$(mktemp -d)"
          hdiutil attach "$disk_image" -nobrowse -readonly -mountpoint "$mount_path"
          cleanup() {
            hdiutil detach "$mount_path"
            rm -rf "$update_path" "$mount_path"
          }
          trap cleanup EXIT

          application_path="$mount_path/Railyard.app"
          test -d "$application_path"
          codesign --verify --deep --strict --verbose=2 "$application_path"
          spctl --assess --type execute --verbose=4 "$application_path"
          xcrun stapler validate "$application_path"

          ./../node_modules/.bin/asar list "$application_path/Contents/Resources/app.asar" > /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/main/index.js' /tmp/package-contents
          grep --fixed-strings --line-regexp '/dist/preload/index.cjs' /tmp/package-contents
          grep --fixed-strings --line-regexp '/node_modules/electron-updater/package.json' /tmp/package-contents

          "$application_path/Contents/MacOS/Railyard" --no-sandbox >/tmp/railyard.log 2>&1 &
          application_pid=$!

          for _ in {1..10}; do
            if ! kill -0 "$application_pid" 2>/dev/null; then
              cat /tmp/railyard.log
              exit 1
            fi
            sleep 1
          done

          kill "$application_pid"
          wait "$application_pid" || true

  publish:
    name: Publish GitHub prerelease
    needs: [validate, verify-debian, verify-macos, verify-windows]
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download Debian release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-amd64
          path: release

      - name: Download macOS release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-mac-universal
          path: release

      - name: Download Windows release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: railyard-${{ needs.validate.outputs.version }}-win-x64
          path: release

      - name: Write GitHub Release notes
        run: bun run release:notes > release-notes.md

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*-mac.yml
            release/*.sha256
            release/*.spdx.json

      - name: Create tag and GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          release_created=false

          cleanup_failed_release() {
            if [[ "$release_created" = true ]]; then
              gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
            fi
          }

          trap cleanup_failed_release ERR

          gh release create "$RELEASE_TAG" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Railyard $VERSION" \
            --notes-file release-notes.md

          release_created=true

          gh release upload "$RELEASE_TAG" \
            release/*.deb \
            release/*.dmg \
            release/*.exe \
            release/*.zip \
            release/*-mac.yml \
            release/*.sha256 \
            release/*.spdx.json

          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*.deb)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-mac-universal.dmg)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-mac-universal.zip)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-mac.yml)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-win-x64-setup.exe)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-amd64.sha256)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-mac-universal.sha256)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-mac-universal.zip.sha256)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-win-x64-setup.sha256)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-amd64.spdx.json)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-mac-universal.spdx.json)" published-assets.txt
          grep --fixed-strings --line-regexp "$(basename release/*-win-x64-setup.spdx.json)" published-assets.txt

          gh release edit "$RELEASE_TAG" --draft=false
          trap - ERR
